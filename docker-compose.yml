services:

  ###########################
  # DEPENDENCIES            #
  ###########################

  # Generate RSA key for xtm-composer (PKCS#8 format)
  rsa-key-generator:
    image: alpine/openssl:latest
    volumes:
      - rsakeys:/keys
    entrypoint: ["/bin/ash"]
    command: ["-c", "if [ ! -f /keys/private_key.pem ]; then openssl genpkey -algorithm RSA -out /keys/private_key.pem -pkeyopt rsa_keygen_bits:4096; fi && tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "test", "-f", "/keys/private_key.pem"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
  redis:
    image: redis:8.6.3
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      # Comment-out the line below for a cluster of multiple nodes
      - discovery.type=single-node
      # Uncomment the line below below for a cluster of multiple nodes
      # - cluster.name=docker-cluster
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery="ERROR"
#      - indices.store.throttle.type=merge
      - "indices.memory.index_buffer_size=15%"
      - "indices.memory.min_index_buffer_size=256mb"
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE} -Xmx${ELASTIC_MEMORY_SIZE} -Dnode.store.allow_mmap=false"
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://elasticsearch:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 50
  minio:
    image: minio/minio:latest
    volumes:
      - s3data:/data
    ports:
      - "9001:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}    
    command: server /data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - "5672:5672"    # AMQP port (used by OpenCTI)
      - "15672:15672"  # Management UI port (add this line)
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=rabbit01@localhost
    volumes:
      - type: bind
        source: ./rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf 
      - amqpdata:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  ###########################
  # COMMON                  #
  ###########################

  xtm-composer:
    image: filigran/xtm-composer:latest
    platform: linux/amd64
    environment:
      - MANAGER__ID=${XTM_COMPOSER_ID}
      - "MANAGER__NAME=XTM Integrations Manager"
      - MANAGER__CREDENTIALS_KEY_FILEPATH=/keys/private_key.pem
      - OPENCTI__ENABLE=true
      - OPENCTI__URL=http://opencti:8080
      - OPENCTI__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - OPENCTI__DAEMON__SELECTOR=docker
      - OPENCTI__DAEMON__DOCKER__NETWORK_MODE=${COMPOSE_PROJECT_NAME}_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - rsakeys:/keys:ro  # RSA key mounted as read-only
    depends_on:
      rsa-key-generator:
        condition: service_healthy
      opencti:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  ###########################
  # OPENCTI                 #
  ###########################
  
  opencti:
    image: opencti/platform:latest
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_EXTERNAL_SCHEME}://${OPENCTI_HOST}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY}
      - APP__INGESTION__CONCURRENCY=4
      - APP__INGESTION__BATCH_SIZE=500
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SMTP__HOSTNAME=${SMTP_HOSTNAME}
      - SMTP__PORT=25
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    healthcheck:
      test:  ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    image: opencti/worker:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 4
    restart: always

  ###########################
  # OPENCTI CONNECTORS      #
  ###########################

  connector-export-file-stix:
    image: opencti/connector-export-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-csv:
    image: opencti/connector-export-file-csv:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_CSV_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-txt:
    image: opencti/connector-export-file-txt:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_TXT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileTxt
      - CONNECTOR_SCOPE=text/plain
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-stix:
    image: opencti/connector-import-file-stix:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-document:
    image: opencti/connector-import-document:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_DOCUMENT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportDocument
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_ONLY_CONTEXTUAL=false # Only extract data related to an entity (a report, a threat actor, etc.)
      - IMPORT_DOCUMENT_CREATE_INDICATOR=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-yara:
    image: opencti/connector-import-file-yara:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_YARA_ID} # Valid UUIDv4
      - CONNECTOR_NAME=ImportFileYARA
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=text/yara+plain
      - CONNECTOR_AUTO=false # Enable/disable auto-import of file
      - YARA_IMPORT_FILE_SPLIT_RULES=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-analysis:
    image: opencti/connector-import-document:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ANALYSIS_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_ANALYSIS
      - CONNECTOR_NAME=ImportDocumentAnalysis
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=false # Validate any bundle before import
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_ONLY_CONTEXTUAL=false # Only extract data related to an entity (a report, a threat actor, etc.)
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-external-reference:
    image: opencti/connector-import-external-reference:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_EXTERNAL_REFERENCE_ID}
      - CONNECTOR_NAME=ImportExternalReference
    restart: always
    depends_on:
      opencti:
        condition: service_healthy          

  ###########################
  # OPENCTI DEFAULT DATA    #
  ###########################

  connector-opencti:
    image: opencti/connector-opencti:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID}
      - "CONNECTOR_NAME=OpenCTI Datasets"
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=100
    restart: always
    depends_on:
      opencti:
        condition: service_healthy      
  connector-mitre:
    image: opencti/connector-mitre:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID}
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=75      
    restart: always
    depends_on:
      opencti:
        condition: service_healthy      


  ######################################
  # Internal Enrichment CONNECTORS     #
  ######################################

  connector-virustotal:
    image: opencti/connector-virustotal:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_VIRUSTOTAL_ID}
      - "CONNECTOR_NAME=VirusTotal"
      - CONNECTOR_SCOPE=StixFile,Artifact,IPv4-Addr,Domain-Name,Url,Hostname
      - CONNECTOR_AUTO=false # Enable/disable auto-enrichment of observables
      - CONNECTOR_LOG_LEVEL=error
      - CONNECTOR_EXPOSE_METRICS=false
      - VIRUSTOTAL_TOKEN=${VIRUSTOTAL_API_KEY}
#      - VIRUSTOTAL_MAX_TLP=TLP:AMBER
#      - VIRUSTOTAL_REPLACE_WITH_LOWER_SCORE=true # Whether to keep the higher of the VT or existing score (false) or force the score to be updated with the VT score even if its lower than existing score (true).
#      # File/Artifact specific config settings
      - VIRUSTOTAL_FILE_CREATE_NOTE_FULL_REPORT=true # Whether or not to include the full report as a Note
#      - VIRUSTOTAL_FILE_UPLOAD_UNSEEN_ARTIFACTS=true # Whether to upload artifacts (smaller than 32MB) that VirusTotal has no record of
#      - VIRUSTOTAL_FILE_INDICATOR_CREATE_POSITIVES=10 # Create an indicator for File/Artifact based observables once this positive threshold is reached. Note: specify 0 to disable indicator creation
#      - VIRUSTOTAL_FILE_INDICATOR_VALID_MINUTES=2880 # How long the indicator is valid for in minutes
#      - VIRUSTOTAL_FILE_INDICATOR_DETECT=true # Whether or not to set detection for the indicator to true
#      - VIRUSTOTAL_FILE_IMPORT_YARA=true # Whether or not import Crowdsourced YARA rules
#      # IP specific config settings
#      - VIRUSTOTAL_IP_INDICATOR_CREATE_POSITIVES=10 # Create an indicator for IPv4 based observables once this positive threshold is reached. Note: specify 0 to disable indicator creation
#      - VIRUSTOTAL_IP_INDICATOR_VALID_MINUTES=2880 # How long the indicator is valid for in minutes
#      - VIRUSTOTAL_IP_INDICATOR_DETECT=true # Whether or not to set detection for the indicator to true
#      - VIRUSTOTAL_IP_ADD_RELATIONSHIPS=false # Whether or not to add ASN and location resolution relationships
#      # Domain specific config settings
#      - VIRUSTOTAL_DOMAIN_INDICATOR_CREATE_POSITIVES=10 # Create an indicator for Domain based observables once this positive threshold is reached. Note: specify 0 to disable indicator creation
#      - VIRUSTOTAL_DOMAIN_INDICATOR_VALID_MINUTES=2880 # How long the indicator is valid for in minutes
#      - VIRUSTOTAL_DOMAIN_INDICATOR_DETECT=true # Whether or not to set detection for the indicator to true
#      - VIRUSTOTAL_DOMAIN_ADD_RELATIONSHIPS=false # Whether or not to add IP resolution relationships
#      # URL specific config settings
#      - VIRUSTOTAL_URL_UPLOAD_UNSEEN=true # Whether to upload URLs that VirusTotal has no record of for analysis
#      - VIRUSTOTAL_URL_INDICATOR_CREATE_POSITIVES=10 # Create an indicator for Url based observables once this positive threshold is reached. Note: specify 0 to disable indicator creation
#      - VIRUSTOTAL_URL_INDICATOR_VALID_MINUTES=2880 # How long the indicator is valid for in minutes
#      - VIRUSTOTAL_URL_INDICATOR_DETECT=true # Whether or not to set detection for the indicator to true
#      # Generic config settings for File, IP, Domain, URL
#      - VIRUSTOTAL_INCLUDE_ATTRIBUTES_IN_NOTE=false # Whether or not to include the attributes info in Note
    deploy:
      mode: replicated
      replicas: 1
    restart: always

  connector-first-epss:
    image: opencti/connector-first-epss:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EPSS_ID} # Optional (default: '18f1a9e6-a82b-4ef4-9699-ae406fe4a1a6')
      - "CONNECTOR_NAME=Internal Enrichment Connector FIRST" # Optional (default: 'First EPSS') 
      - CONNECTOR_SCOPE=vulnerability # Optional (default: ['vulnerability'])
      - CONNECTOR_LOG_LEVEL=error # Optional (default: 'error')
      - CONNECTOR_AUTO=false # Optional (default: false)
      - FIRST_EPSS_API_BASE_URL=https://api.first.org/data/v1/epss # Optional (default: 'https://api.first.org/data/v1/epss')
      - FIRST_EPSS_MAX_TLP=TLP:AMBER # Optional (default: 'TLP:AMBER')
    deploy:
      mode: replicated
      replicas: 4
    restart: always

  connector-crowdsec:
    image: opencti/connector-crowdsec:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_CROWDSEC_ID}
      - CONNECTOR_NAME=CrowdSec
      - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr
      - CONNECTOR_LOG_LEVEL=error
      - CONNECTOR_AUTO=true
      - CONNECTOR_UPDATE_EXISTING_DATA=false
      - CROWDSEC_KEY=${CROWDSEC_API_KEY}
      - CROWDSEC_API_VERSION=v2
      - CROWDSEC_MAX_TLP=TLP:RED
      - CROWDSEC_LABELS_SCENARIO_NAME=true
      - CROWDSEC_LABELS_CVE=true
      - CROWDSEC_LABELS_MITRE=true
      - CROWDSEC_LABELS_REPUTATION=true
      - CROWDSEC_INDICATOR_CREATE_FROM=malicious,suspicious,known
      - CROWDSEC_ATTACK_PATTERN_CREATE_FROM_MITRE=true
      - CROWDSEC_CREATE_NOTE=true
      - CROWDSEC_CREATE_SIGHTING=true
      - CROWDSEC_CREATE_TARGETED_COUNTRIES_SIGHTINGS=true
      - CROWDSEC_VULNERABILITY_CREATE_FROM_CVE=true
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
        
  connector-shodan:
    image: opencti/connector-shodan:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_SHODAN_ID} # Optional (default: '82b58916-a654-4cd4-81de-700eb72a5c94')
      - CONNECTOR_NAME=Shodan # Optional (default: 'Shodan')
      - CONNECTOR_SCOPE=ipv4-addr,indicator # Optional (default: ['ipv4-addr', 'indicator'])
      - CONNECTOR_AUTO=false # Optional (default: false)
      - CONNECTOR_LOG_LEVEL=error # Optional (default: error)
      - SHODAN_TOKEN=${SHODAN_API_KEY}
      #- SHODAN_MAX_TLP=TLP:AMBER # Optional (default: 'TLP:AMBER')
      #- SHODAN_DEFAULT_SCORE=50 # Optional (default: 50)
      #- SHODAN_IMPORT_SEARCH_RESULTS=true # Optional (default: true)
      #- SHODAN_CREATE_NOTE=true # Optional (default: true)
      - SHODAN_USE_ISP_NAME_FOR_ASN=true # Optional (default: false)
    restart: always 


  ###########################
  # EXTERNAL CONNECTORS     #
  ###########################

  connector-group-ib:
    image: opencti/connector-group-ib:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_GROUP_IB_ID}
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - "CONNECTOR_NAME=Group-IB Threat Intelligence"
      - CONNECTOR_SCOPE=stix2,ipv4-addr,ipv6-addr,vulnerability,domain,url,StixFile
      - CONNECTOR_CONFIDENCE_LEVEL=${CONNECTOR_GROUP_IB_CONFIDENCE_LEVEL:-80}
      - CONNECTOR_UPDATE_EXISTING_DATA=true
      - CONNECTOR_LOG_LEVEL=error
      - CONNECTOR_DURATION_PERIOD=PT12H
      # API Settings
      - TI_API_URL=https://tap.group-ib.com/api/v2/
      - TI_API_USERNAME=${GROUP_IB_USERNAME}
      - TI_API_TOKEN=${GROUP_IB_API_KEY}
      # Proxy Settings (Fixes the AttributeError)
      - TI_API_PROXY_IP=
      - TI_API_PROXY_PORT=
      - TI_API_PROXY_PROTOCOL=
      - TI_API_PROXY_USERNAME=
      - TI_API_PROXY_PASSWORD=
      - CONNECTOR_TI_API_PROXY_IP=
      - CONNECTOR_TI_API_PROXY_PORT=
      - CONNECTOR_TI_API_PROXY_PROTOCOL=
      - CONNECTOR_TI_API_PROXY_USERNAME=
      - CONNECTOR_TI_API_PROXY_PASSWORD=
      # Collections Settings
      - TI_API_EXTRA_SETTINGS_IGNORE_NON_INDICATOR_THREAT_REPORTS=false
      - TI_API_EXTRA_SETTINGS_IGNORE_NON_INDICATOR_THREATS=false
      - TI_API_EXTRA_SETTINGS_IGNORE_NON_MALWARE_DDOS=true
      - TI_API_EXTRA_SETTINGS_INTRUSION_SET_INSTEAD_OF_THREAT_ACTOR=false
      - TI_API_EXTRA_SETTINGS_SCHEDULE_TIME=04:00
      - TI_API_EXTRA_SETTINGS_TIME_OUTPUT_FORMAT=%Y-%m-%d %H:%M:%S
      - TI_API_EXTRA_SETTINGS_ENABLE_STATEMENT_MARKING=false
      # Collection APT Threats
      - TI_API__COLLECTIONS__APT_THREAT__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__APT_THREAT__ENABLE=true
      - TI_API__COLLECTIONS__APT_THREAT__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__APT_THREAT__TTL=1460
      - TI_API__COLLECTIONS__APT_THREAT__USE_HUNTING_RULES=false
      # Collection  APT Threat Actor
      - TI_API__COLLECTIONS__APT_THREAT_ACTOR__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__APT_THREAT_ACTOR__ENABLE=true
      - TI_API__COLLECTIONS__APT_THREAT_ACTOR__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__APT_THREAT_ACTOR__TTL=1460
      # Collection DDOS Attacks
      - TI_API__COLLECTIONS__ATTACKS_DDOS__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__ATTACKS_DDOS__ENABLE=true
      - TI_API__COLLECTIONS__ATTACKS_DDOS__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__ATTACKS_DDOS__TTL=10
      # Collection Deface Attacks
      - TI_API__COLLECTIONS__ATTACKS_DEFACE__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__ATTACKS_DEFACE__ENABLE=true
      - TI_API__COLLECTIONS__ATTACKS_DEFACE__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__ATTACKS_DEFACE__TTL=10
      # Collection Phishing Attacks
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_GROUP__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_GROUP__ENABLE=true
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_GROUP__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_GROUP__TTL=5
      # Collection Phishing kits
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_KIT__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_KIT__ENABLE=true
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_KIT__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__ATTACKS_PHISHING_KIT__TTL=30
      # Collection Nation State Threats
      - TI_API__COLLECTIONS__HI_THREAT__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__HI_THREAT__ENABLE=true
      - TI_API__COLLECTIONS__HI_THREAT__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__HI_THREAT__TTL=1460
      - TI_API__COLLECTIONS__HI_THREAT__USE_HUNTING_RULES=false
      # Collection Nation State Threat Actors
      - TI_API__COLLECTIONS__HI_THREAT_ACTOR__DEFAULT_DATE=${GROUP_IB_DEFDATE}
      - TI_API__COLLECTIONS__HI_THREAT_ACTOR__ENABLE=true
      - TI_API__COLLECTIONS__HI_THREAT_ACTOR__LOCAL_CUSTOM_TAG=null
      - TI_API__COLLECTIONS__HI_THREAT_ACTOR__TTL=1460
      # Collection IOC Common
